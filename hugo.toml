baseURL = 'https://fuenrob.com/'
theme = 'linkstree'
enableRobotsTXT = true

defaultContentLanguage = 'es'
defaultContentLanguageInSubdir = false

[params]
  kofiUrl = 'https://ko-fi.com/fuenrob'
  membershipUrl = 'https://www.youtube.com/@FuenRob/membership'

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'onedark'
    tabWidth = 4

[languages]
  [languages.es]
    locale = 'es-ES'
    label = 'Español'
    contentDir = 'content/es'
    weight = 1
    title = 'Roberto Morais (fuenrob) | Desarrollador de Software'

    [languages.es.params]
      metaDescription = 'Sitio web personal y blog de Roberto Morais (fuenrob), desarrollador de software especializado en Golang, PHP y JavaScript.'
      metaKeywords = 'Roberto Morais, fuenrob, FuenRob, desarrollador de software, Golang, Go, PHP, JavaScript, Hugo, arquitectura de software, blog de tecnología'

    [languages.es.params.Author]
      name = 'Roberto Morais (fuenrob)'
      bio = 'Desarrollador de software especializado en Golang, PHP y JavaScript'
      image = '/images/author/fuenrob.jpg'
      social = [
        { url = 'https://github.com/FuenRob', icon = 'fab fa-github', ariaLabel = 'Ir a GitHub' },
        { url = 'https://www.linkedin.com/in/robercmorais/', icon = 'fab fa-linkedin', ariaLabel = 'Ir a LinkedIn' },
        { url = 'https://discord.gg/rm7r6zFq', icon = 'fab fa-discord', ariaLabel = 'Ir a Discord' },
        { url = 'https://x.com/FuenRob', icon = 'fab fa-x-twitter', ariaLabel = 'Ir a X' },
        { url = 'https://www.instagram.com/fuenrob/', icon = 'fab fa-instagram', ariaLabel = 'Ir a Instagram' },
        { url = 'https://www.tiktok.com/@fuenrob', icon = 'fab fa-tiktok', ariaLabel = 'Ir a TikTok' },
        { url = 'https://www.youtube.com/@FuenRob', icon = 'fab fa-youtube', ariaLabel = 'Ir a YouTube' }
      ]
      links = [
        { name = 'Mi canal de YouTube', url = 'https://www.youtube.com/@FuenRob', description = 'Tutoriales de programación y desarrollo de software', icon = 'fab fa-youtube', platform = 'YouTube' },
        { name = 'Mi código', url = 'https://github.com/FuenRob', description = 'Aquí puedes encontrar mis proyectos', icon = 'fab fa-github', platform = 'GitHub' },
        { name = 'El servidor de Discord de la comunidad', url = 'https://discord.gg/rm7r6zFq', description = 'Únete a nuestra comunidad de desarrolladores', icon = 'fab fa-discord', platform = 'Discord' },
        { name = 'Mi carrera profesional', url = 'https://www.linkedin.com/in/robercmorais/', description = 'Aquí puedes ver toda mi experiencia profesional', icon = 'fab fa-linkedin', platform = 'LinkedIn' },
        { name = 'Sígueme en X', url = 'https://x.com/FuenRob', icon = 'fab fa-x-twitter', platform = 'X' },
        { name = 'Sígueme en Instagram', url = 'https://www.instagram.com/fuenrob/', icon = 'fab fa-instagram', platform = 'Instagram' },
        { name = 'Sígueme en TikTok', url = 'https://www.tiktok.com/@fuenrob', icon = 'fab fa-tiktok', platform = 'TikTok' },
        { name = 'Invítame a un café', url = 'https://ko-fi.com/fuenrob', description = 'Apoya mi trabajo con una pequeña donación', icon = 'fas fa-mug-hot', platform = 'Ko-fi' },
